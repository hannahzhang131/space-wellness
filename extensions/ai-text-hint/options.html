<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <h1>Settings</h1>

  <p id="paid-status" class="status"></p>
  <button type="button" id="manage-pay" class="primary">Upgrade or manage purchase</button>

  <hr />

  <h2>Custom phrase blocklist</h2>

  <textarea id="custom" rows="6" placeholder="Moreover&#10;极其重要"></textarea>
  <button type="button" id="save-custom" class="secondary">Save custom phrases</button>
  <p id="custom-status" class="status"></p>

  <script src="payments.js"></script>
  <script src="options.js"></script>
</body>
</html>
